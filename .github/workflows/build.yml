{"name":"Build APK","on":{"workflow_dispatch":{},"push":{"branches":["main","master"]}},"jobs":{"build":{"runs-on":"ubuntu-24.04","timeout-minutes":20,"steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.9","cache-disabled":true}},{"name":"Build","run":"set -e\nf=project.b64\nif [ -f project.b64.txt ]; then f=project.b64.txt; fi\necho \"=== SOURCE FILE: $f ===\"\nls -l \"$f\"\nwc -c \"$f\"\nrm -rf work pkg.bin\ntr -d '\\r\\n\\t ' < \"$f\" | base64 -d > pkg.bin\nls -l pkg.bin\nmkdir work\nif [ \"$(head -c2 pkg.bin)\" = \"PK\" ]; then unzip -q -o pkg.bin -d work; else tar -xf pkg.bin -C work; fi\ncd work/DotLauncher\necho \"=== BUILDING VERSION ===\"\ngrep -n \"versionName\\|versionCode\" app/build.gradle\ngradle clean assembleDebug --no-daemon --no-build-cache --stacktrace\n"},{"uses":"actions/upload-artifact@v4","with":{"name":"DotLauncher-apk","path":"work/DotLauncher/app/build/outputs/apk/debug/app-debug.apk"}}]}}}
